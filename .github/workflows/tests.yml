name: tests

on:
  push:
    branches:
      - post-install-options

jobs:
  post-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        answers:
          - '{"auth_features": []}'
          - '{"auth_features": ["email-verification"]}'
          - '{"auth_features": ["2fa"]}'
          - '{"auth_features": ["email-verification", "2fa"]}'

    name: "${{ matrix.answers }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm install

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run post-install
        env:
          ANSWERS: "${{ matrix.answers }}"
        run: php artisan install:features --answers="$ANSWERS"

      - name: Run tests
        run: ./vendor/bin/phpunit
